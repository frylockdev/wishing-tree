<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="340" viewBox="0 0 1200 340"
     role="img" aria-labelledby="title desc">
  <title id="title">Сад Выгоды</title>
  <desc id="desc">Кликабельный MVP фермерской мини-игры: дерево проходит пять стадий роста от ростка до плодов.</desc>

  <rect width="1200" height="340" rx="24" fill="#0E2A18"/>

  <!-- Title block: category, name, description, metadata -->
  <g id="title-block" transform="translate(64 0)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text y="84" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" letter-spacing="3" fill="#86A88F">PHASER 3 &#183; TYPESCRIPT &#183; VITE</text>
    <text y="158" font-size="66" font-weight="800" fill="#F7F2E5">Сад Выгоды</text>
    <text y="206" font-size="24" fill="#CFE3CF">Кликабельный MVP фермерской мини-игры</text>
    <text y="238" font-size="24" fill="#CFE3CF">для приложений «Пятёрочки» и «Перекрёстка»</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#86A88F">
      <text y="290">без бэкенда · мок-API · 2 бренд-скина</text>
    </g>
  </g>

  <!-- Growth strip: five tree stages, the core loop of the game -->
  <g id="growth-strip">
    <line x1="620" y1="281" x2="1150" y2="281" stroke="#3C6B4A" stroke-width="3" stroke-linecap="round"/>

    <!-- Stage 1: sprout -->
    <g transform="translate(650 281)">
      <path d="M0 0 V-26" stroke="#6FBF4E" stroke-width="4" stroke-linecap="round" fill="none"/>
      <path d="M0 -22 C-14 -26 -18 -38 -16 -44 C-6 -42 0 -34 0 -22 Z" fill="#6FBF4E"/>
      <path d="M0 -26 C14 -30 18 -42 16 -48 C6 -46 0 -38 0 -26 Z" fill="#8ED06F"/>
    </g>

    <!-- Stage 2: sapling -->
    <g transform="translate(760 281)">
      <path d="M0 0 V-52" stroke="#8A5A33" stroke-width="6" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="-66" r="22" fill="#5FAE43"/>
      <circle cx="-12" cy="-56" r="14" fill="#6FBF4E"/>
      <circle cx="12" cy="-58" r="14" fill="#7EC85C"/>
    </g>

    <!-- Stage 3: young tree -->
    <g transform="translate(875 281)">
      <path d="M0 0 V-74 M0 -46 L-16 -62 M0 -52 L14 -66" stroke="#8A5A33" stroke-width="7" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="-98" r="34" fill="#5FAE43"/>
      <circle cx="-22" cy="-84" r="22" fill="#6FBF4E"/>
      <circle cx="22" cy="-86" r="22" fill="#7EC85C"/>
    </g>

    <!-- Stage 4: blossom -->
    <g transform="translate(995 281)">
      <path d="M0 0 V-88 M0 -54 L-20 -74 M0 -62 L18 -80" stroke="#8A5A33" stroke-width="8" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="-116" r="40" fill="#5FAE43"/>
      <circle cx="-26" cy="-100" r="25" fill="#6FBF4E"/>
      <circle cx="26" cy="-102" r="25" fill="#7EC85C"/>
      <g fill="#FBE9EE">
        <circle cx="-18" cy="-124" r="5"/>
        <circle cx="8" cy="-136" r="5"/>
        <circle cx="26" cy="-112" r="5"/>
        <circle cx="-30" cy="-98" r="5"/>
        <circle cx="2" cy="-104" r="5"/>
      </g>
    </g>

    <!-- Stage 5: fruit -->
    <g transform="translate(1112 281)">
      <path d="M0 0 V-100 M0 -60 L-24 -84 M0 -70 L22 -92" stroke="#8A5A33" stroke-width="9" stroke-linecap="round" fill="none"/>
      <circle cx="0" cy="-132" r="46" fill="#5FAE43"/>
      <circle cx="-30" cy="-114" r="28" fill="#6FBF4E"/>
      <circle cx="30" cy="-116" r="28" fill="#7EC85C"/>
      <g fill="#E8443A">
        <circle cx="-20" cy="-142" r="7"/>
        <circle cx="12" cy="-154" r="7"/>
        <circle cx="32" cy="-124" r="7"/>
        <circle cx="-36" cy="-110" r="7"/>
        <circle cx="4" cy="-116" r="7"/>
      </g>
    </g>

    <!-- Water drops between stages: watering drives growth -->
    <g fill="#56AEE8">
      <path d="M705 236 c-7 10 -7 17 0 21 c7 -4 7 -11 0 -21 Z" opacity="0.9"/>
      <path d="M818 226 c-7 10 -7 17 0 21 c7 -4 7 -11 0 -21 Z" opacity="0.9"/>
      <path d="M936 214 c-7 10 -7 17 0 21 c7 -4 7 -11 0 -21 Z" opacity="0.9"/>
      <path d="M1054 202 c-7 10 -7 17 0 21 c7 -4 7 -11 0 -21 Z" opacity="0.9"/>
    </g>

    <!-- Stage numbers -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18" fill="#86A88F" text-anchor="middle">
      <text x="650" y="312">1</text>
      <text x="760" y="312">2</text>
      <text x="875" y="312">3</text>
      <text x="995" y="312">4</text>
      <text x="1112" y="312">5</text>
    </g>
  </g>
</svg>
